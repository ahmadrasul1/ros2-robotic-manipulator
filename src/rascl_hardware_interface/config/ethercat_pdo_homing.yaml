# Explicit four-axis homing and pick-ready commissioning configuration.
#
# This mode homes the three arm axes and then the end effector's one reference
# switch. The all-zero pick-ready move includes the end effector only after that
# runtime verification succeeds. CSP trajectory motion remains disabled here.

ethercat:
  interface: enx3c18a026482c
  cycle_time_us: 10000
  processdata_timeout_us: 5000
  use_distributed_clocks: true
  dc_shift_ns: 0
startup:
  mode: home_then_pick_ready
runtime:
  command_socket: /tmp/rascl_csp.sock
  ready_file: /tmp/rascl_pdo_ready
  command_watchdog_ms: 250
  wkc_fault_cycles: 3
  state_fault_cycles: 5
  timing_fault_cycles: 3
  max_cycle_lateness_us: 2000
  feedback_log_period_s: 1.0
  realtime_priority: 50
  cpu_affinity: null
safety:
  allow_motion: false
  allow_unhomed_motion: false
  # Compatibility field only. Runtime readiness is derived from the
  # completed one-switch homing result, never from this YAML value.
  gripper_reference_valid: false
  abort_connection_option_code: 3
  quick_stop_option_code: 5
  halt_option_code: 1
  position_min_rad:
  - -1.570796327
  - -1.5708
  - -1.571
  - -0.70
  position_max_rad:
  - 1.570796327
  - 1.5708
  - 1.571
  - 0.02
  max_velocity_rad_s:
  - 6.0
  - 6.0
  - 6.0
  - 0.8
  max_tracking_error_rad:
  - 0.08
  - 0.08
  - 0.08
  - 0.1
  drive_following_error_window_rad:
  - 0.08
  - 0.08
  - 0.06
  - 0.02
  drive_following_error_timeout:
  - 500
  - 500
  - 500
  - 100
  minimum_motor_speed_rpm:
  - 0
  - 0
  - 0
  - 500
  first_command_tolerance_rad:
  - 0.03
  - 0.03
  - 0.03
  - 0.05
  initial_sync_limit_tolerance_rad:
  - 0.001
  - 0.001
  - 0.001
  - 0.001