controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_position_controller:
      type: forward_command_controller/ForwardCommandController

joint_position_controller:
  ros__parameters:
    joints:
      - shoulder_joint
      - upperarm_joint
      - lowerarm_joint
      - end_effector_joint
    interface_name: position